
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RaceRoom Ranked - Jordi Audet</title>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: 'Montserrat', sans-serif;
    }

    .widget {
      width: 100%;
      max-width: 420px;
      padding: 20px;
      color: #fff;
      background: rgba(0, 0, 0, 0.30);
      border: 1px solid rgba(255, 0, 35, 0.8);
      border-radius: 12px;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      box-shadow: 0 0 18px rgba(255, 0, 35, 0.12);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .brand {
      color: #fff;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .live {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ff002d;
      box-shadow: 0 0 8px #ff002d;
    }

    .pilot {
      margin-bottom: 18px;
      color: #fff;
      font-size: 22px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .stat {
      min-width: 0;
      padding: 12px 8px;
      text-align: center;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 7px;
    }

    .stat-label {
      margin-bottom: 7px;
      color: #fff;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .stat-value {
      color: #fff;
      font-size: 21px;
      font-weight: 900;
      line-height: 1.2;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-top: 15px;
      padding-top: 11px;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 9px;
      font-weight: 600;
    }

    .status {
      color: #fff;
    }

    .error {
      color: #ff526d;
    }

    @media (max-width: 340px) {
      .widget {
        padding: 14px;
      }

      .stat-value {
        font-size: 18px;
      }

      .stat-label {
        font-size: 8px;
      }
    }
  </style>
</head>

<body>
  <div class="widget">
    <div class="header">
      <div class="brand">RACEROOM RANKED</div>
      <div class="live">
        <span class="live-dot"></span>
        LIVE
      </div>
    </div>

    <div class="pilot">Jordi Audet</div>

    <div class="stats">
      <div class="stat">
        <div class="stat-label">RATING</div>
        <div class="stat-value" id="rating">—</div>
      </div>

      <div class="stat">
        <div class="stat-label">REPUTACIÓN</div>
        <div class="stat-value" id="reputation">—</div>
      </div>

      <div class="stat">
        <div class="stat-label">GLOBAL</div>
        <div class="stat-value" id="position">—</div>
      </div>
    </div>

    <div class="footer">
      <span class="status" id="status">Conectando...</span>
      <span id="updated">--:--:--</span>
    </div>
  </div>

  <script>
    const PLAYER_NICKNAME = "jaudetb";
    const API_URL = "https://game.raceroom.com/multiplayer-rating/ratings.json";
    const REFRESH_INTERVAL = 60000;

    const normalize = value =>
      String(value || "").trim().toLowerCase();

    function findPlayers(data, results = []) {
      if (!data || typeof data !== "object") return results;

      if (Array.isArray(data)) {
        data.forEach(item => findPlayers(item, results));
        return results;
      }

      const name =
        data.nickname ??
        data.username ??
        data.name ??
        data.player_name ??
        data.driver ??
        data.nick;

      const rating =
        data.rating ??
        data.elo ??
        data.points ??
        data.skill_rating;

      const reputation =
        data.reputation ??
        data.rep ??
        data.safety_rating ??
        data.safety;

      const position =
        data.position ??
        data.rank ??
        data.place ??
        data.global_position;

      if (name && rating !== undefined) {
        results.push({
          name: String(name),
          rating: Number(rating),
          reputation: reputation ?? "—",
          position: position ?? null
        });
      }

      Object.values(data).forEach(value => {
        if (value && typeof value === "object") {
          findPlayers(value, results);
        }
      });

      return results;
    }

    async function updateWidget() {
      const status = document.getElementById("status");

      try {
        const response = await fetch(API_URL, {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error("Error HTTP " + response.status);
        }

        const data = await response.json();
        const players = findPlayers(data);

        const player = players.find(item =>
          normalize(item.name) === normalize(PLAYER_NICKNAME)
        );

        if (!player) {
          throw new Error("Piloto no encontrado");
        }

        document.getElementById("rating").textContent =
          Number.isFinite(player.rating)
            ? Math.round(player.rating).toLocaleString("es-ES")
            : "—";

        document.getElementById("reputation").textContent =
          player.reputation;

        let position = player.position;

        if (position === null || position === undefined) {
          const sorted = [...players]
            .filter(p => Number.isFinite(p.rating))
            .sort((a, b) => b.rating - a.rating);

          position = sorted.findIndex(p =>
            normalize(p.name) === normalize(PLAYER_NICKNAME)
          ) + 1;
        }

        document.getElementById("position").textContent =
          position > 0 ? "#" + position : "—";

        status.textContent = "Datos actualizados";
        status.className = "status";

        document.getElementById("updated").textContent =
          new Date().toLocaleTimeString("es-ES");

      } catch (error) {
        console.error("RaceRoom Ranked:", error);
        status.textContent = "Error al cargar datos";
        status.className = "error";
      }
    }

    updateWidget();
    setInterval(updateWidget, REFRESH_INTERVAL);
  </script>
</body>
</html>
