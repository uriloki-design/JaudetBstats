
<div id="rr-widget">
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap');

#rr-widget {
  font-family:Montserrat,sans-serif;
  color:#fff;
  width:100%;
  max-width:850px;
  margin:auto;
  background:transparent;
}

#rr-widget * {box-sizing:border-box}

#rr-widget .panel {
  background:rgba(0,0,0,0.30);
  border:2px solid rgba(224,0,32,.85);
  border-left:6px solid #ff102f;
  border-radius:12px;
  padding:22px;
  box-shadow:0 0 14px rgba(255,0,35,.22);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
}

#rr-widget .header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
  gap:10px;
}

#rr-widget .brand {
  font-size:17px;
  font-weight:900;
  letter-spacing:2px;
}

#rr-widget .nick {
  color:#ff1738;
  font-size:20px;
  margin-top:7px;
  font-weight:900;
  letter-spacing:2px;
  text-transform:uppercase;
  text-shadow:0 0 10px rgba(255,0,35,.4);
}

#rr-widget .live {
  font-size:10px;
  color:#69dc91;
  font-weight:800;
  white-space:nowrap;
}

#rr-widget .stats {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px;
}

#rr-widget .stat {
  background:rgba(255,0,35,.035);
  border:1px solid rgba(255,0,35,.45);
  padding:16px 8px;
  border-radius:8px;
  text-align:center;
  min-width:0;
}

#rr-widget .label {
  color:#fff;
  font-size:10px;
  font-weight:800;
  letter-spacing:1.3px;
}

#rr-widget .number {
  font-size:clamp(21px,4vw,34px);
  font-weight:900;
  margin-top:9px;
  white-space:nowrap;
  overflow:hidden;
  text-shadow:0 1px 4px rgba(0,0,0,.7);
  color:#fff;
}

#rr-widget .gold {color:#ff1738}

#rr-widget .footer {
  display:flex;
  justify-content:space-between;
  margin-top:14px;
  color:#fff;
  font-size:9px;
  gap:8px;
}

@media(max-width:480px) {
  #rr-widget .panel {padding:13px}
  #rr-widget .stats {gap:6px}
  #rr-widget .stat {padding:13px 4px}
  #rr-widget .label {font-size:8px}
  #rr-widget .nick {font-size:17px}
}
</style>

<div class="panel">
  <div class="header">
    <div>
      <div class="brand">RACEROOM RANKED</div>
      <div class="nick" id="rr-name">JORDI AUDET</div>
    </div>
    <div class="live">● LIVE</div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="label">RATING</div>
      <div class="number gold" id="rr-rating">---</div>
    </div>

    <div class="stat">
      <div class="label">REPUTACIÓN</div>
      <div class="number" id="rr-rep">---</div>
    </div>

    <div class="stat">
      <div class="label">GLOBAL</div>
      <div class="number" id="rr-position">---</div>
    </div>
  </div>

  <div class="footer">
    <span id="rr-status">Conectando...</span>
    <span id="rr-time">--:--:--</span>
  </div>
</div>
</div>

<script>
(() => {
  const PILOT_NICK = "jaudetb";
  const DISPLAY_NAME = "Jordi Audet";
  const API = "https://game.raceroom.com/multiplayer-rating/ratings.json";
  const INTERVAL = 60000;

  const $ = id => document.getElementById(id);

  const normalize = s => String(s ?? "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .toLowerCase().trim();

  const cleanKey = s =>
    normalize(s).replace(/[^a-z0-9]/g,"");

  function getField(obj, aliases) {
    if (!obj || typeof obj !== "object") return null;

    for (const [key,value] of Object.entries(obj)) {
      if (
        aliases.includes(cleanKey(key)) &&
        value !== null &&
        value !== ""
      ) return value;
    }
    return null;
  }

  function num(value) {
    if (typeof value === "number") return value;

    if (typeof value === "string") {
      const n = Number(value.replace(",","."));
      return Number.isFinite(n) ? n : null;
    }
    return null;
  }

  function findPlayers(data) {
    const result = [];
    const visited = new WeakSet();

    const nameKeys = [
      "name","username","playername","drivername",
      "nickname","displayname","fullname"
    ];

    const ratingKeys = [
      "rating","rankedrating","mprating",
      "elo","skillrating"
    ];

    const repKeys = [
      "reputation","rep","rankedreputation",
      "mpreputation","safetyrating"
    ];

    const posKeys = [
      "position","globalposition","globalrank",
      "worldrank","rank","place"
    ];

    function walk(node,depth) {
      if (
        !node ||
        typeof node !== "object" ||
        depth > 12 ||
        visited.has(node)
      ) return;

      visited.add(node);

      if (Array.isArray(node)) {
        node.forEach(x => walk(x,depth+1));
        return;
      }

      const name = getField(node,nameKeys);
      const rating = num(getField(node,ratingKeys));
      const rep = num(getField(node,repKeys));
      const pos = num(getField(node,posKeys));

      if (name != null && rating != null && rep != null) {
        result.push({
          name:String(name),
          rating,
          rep,
          pos
        });
      }

      Object.values(node).forEach(x => {
        if (x && typeof x === "object") {
          walk(x,depth+1);
        }
      });
    }

    walk(data,0);
    return result;
  }

  async function update() {
    try {
      const response = await fetch(
        API + "?t=" + Date.now(),
        {cache:"no-store"}
      );

      if (!response.ok) {
        throw new Error("HTTP " + response.status);
      }

      const data = await response.json();
      const players = findPlayers(data);

      if (!players.length) {
        throw new Error("Estructura JSON no reconocida");
      }

      const pilot = players.find(
        p => normalize(p.name) === normalize(PILOT_NICK)
      );

      if (!pilot) {
        throw new Error("Piloto JA UDETB no encontrado");
      }

      let position = pilot.pos;

      if (position == null) {
        const sorted = [...players].sort(
          (a,b) => b.rating-a.rating
        );

        position = sorted.findIndex(
          p => normalize(p.name) === normalize(pilot.name)
        ) + 1;
      }

      $("rr-name").textContent = DISPLAY_NAME;

      $("rr-rating").textContent =
        pilot.rating.toLocaleString("es-ES");

      $("rr-rep").textContent =
        pilot.rep.toLocaleString("es-ES");

      $("rr-position").textContent =
        position > 0 ? "#" + position : "---";

      $("rr-status").textContent = "Datos actualizados";

      $("rr-time").textContent =
        new Date().toLocaleTimeString("es-ES");

    } catch(error) {
      console.error("RaceRoom:",error);
      $("rr-status").textContent =
        "Error de conexión / CORS";
    }
  }

  update();
  setInterval(update,INTERVAL);
})();
</script>
